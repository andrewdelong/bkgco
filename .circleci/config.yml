version: 2.1

# Build the extension and run the test suite on Linux, macOS and Windows.
# Each job follows the README: build in place, then run unittest from the repo root.
# The suite's C++ test (tests/cpp_all_types.cpp) needs a c++/g++/clang++ on PATH;
# it skips itself where there is none, which is the case on the Windows image.

orbs:
  win: circleci/windows@5.0

jobs:
  linux:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: python -m pip install --upgrade pip setuptools numpy
      - run:
          name: Build extension
          command: python setup.py build_ext --inplace
      - run:
          name: Run tests
          command: python -m unittest discover -s tests -v
      - run:
          name: Build the bundled C++ example (legacy, non-template interface)
          command: >
            g++ -O2 -DNDEBUG -std=c++11 -w -I cpp/gco -o /tmp/gco_example
            cpp/gco/example.cpp cpp/gco/GCoptimization.cpp cpp/gco/LinkedBlockList.cpp

  macos:
    macos:
      xcode: 16.2.0
    steps:
      - checkout
      - run:
          name: Install Python 3.13
          command: brew install python@3.13
      - run:
          name: Create virtualenv with build dependencies
          # brew's interpreter is externally managed (PEP 668), so install into a venv
          command: |
            "$(brew --prefix python@3.13)/bin/python3.13" -m venv ~/venv
            ~/venv/bin/python -m pip install --upgrade pip setuptools numpy
      - run:
          name: Build extension
          command: ~/venv/bin/python setup.py build_ext --inplace
      - run:
          name: Run tests
          command: ~/venv/bin/python -m unittest discover -s tests -v

  windows:
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout
      - run:
          name: Install Python 3.13
          # the py launcher it registers keeps the version explicit in later steps
          command: choco install -y python313 --no-progress
      - run:
          name: Install build dependencies
          command: py -3.13 -m pip install --upgrade pip setuptools numpy
      - run:
          name: Build extension
          # MSVC comes from the Visual Studio Build Tools in the image; setuptools
          # finds them via vswhere. If a future image drops them, add:
          #   choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools
          command: py -3.13 setup.py build_ext --inplace
      - run:
          name: Run tests
          command: py -3.13 -m unittest discover -s tests -v

workflows:
  build-and-test:
    jobs:
      - linux
      - macos
      - windows
