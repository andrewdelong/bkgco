name: CI

# Build the extension and run the test suite on Linux, macOS and Windows.
# Each job follows the README: build in place, then run unittest from the repo root.
# The suite's C++ test (tests/cpp_all_types.cpp) needs a c++/g++/clang++ on PATH,
# which setup-python's runners all provide; it skips itself if none is found.
#
# The "t" versions (e.g. "3.13t") are free-threaded (PEP 703, no-GIL) builds --
# actions/setup-python resolves the suffix to the free-threaded artifact on every
# OS. The extension declares Py_mod_gil=Py_MOD_GIL_NOT_USED and has had a real,
# free-threading-only crash before (concurrent close() vs. in-flight call racing
# on the same object's backend pointer: safe-by-accident under the GIL's
# scheduling, a reliable segfault without it), so these are load-bearing, not
# just-in-case, jobs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14t"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Fail loudly, not silently, if a "t" job ever ends up on a GIL-enabled
      # interpreter (e.g. a manifest regression) -- the whole point of these
      # jobs is exercising the no-GIL path.
      - name: Verify free-threaded build is active
        if: endsWith(matrix.python-version, 't')
        run: >
          python -c "import sys; assert not sys._is_gil_enabled(), 'expected a free-threaded build, but the GIL is enabled'; print('confirmed: GIL disabled')"

      # Guards against a non-Apple clang++ (e.g. Homebrew LLVM) landing ahead of
      # Xcode's on PATH. A step, not a job-level `env:`, because setting CC/CXX to
      # "" on the other platforms (rather than leaving them unset) breaks distutils:
      # it does CC.split() to find the compiler, so CC="" makes the first compile
      # flag land in argv[0], which the OS then tries to execute as a path.
      - name: Pin CC/CXX to Apple clang
        if: runner.os == 'macOS'
        run: |
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools numpy

      - name: Build extension
        run: python setup.py build_ext --inplace

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the bundled C++ example (legacy, non-template interface)
        if: runner.os == 'Linux'
        run: >
          g++ -O2 -DNDEBUG -std=c++11 -w -I cpp/gco -o /tmp/gco_example
          cpp/gco/example.cpp cpp/gco/GCoptimization.cpp cpp/gco/LinkedBlockList.cpp
