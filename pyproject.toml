[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bkgco"
version = "0.1.0"
description = "Python wrapper for the BK maxflow and GCO C++ libraries"
readme = "README.md"
requires-python = ">=3.10"
# Custom, non-SPDX license (research use only); full terms in the referenced file.
# "LicenseRef-" is the PEP 639 convention for exactly this case.
license = "LicenseRef-GCO-Research-Only"
license-files = ["cpp/gco/GCO_README.TXT"]
authors = [
    { name = "Andrew Delong", email = "andrew.delong@gmail.com" },
]
keywords = ["graph-cut", "maxflow", "energy-minimization", "segmentation", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/andrewdelong/bkgco"
Repository = "https://github.com/andrewdelong/bkgco"
Issues = "https://github.com/andrewdelong/bkgco/issues"

[tool.setuptools]
packages = ["bkgco"]

[tool.setuptools.package-data]
bkgco = ["py.typed", "_bkgco.pyi"]
